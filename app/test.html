<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rembrandt · Test</title>
<link rel="stylesheet" href="style.css">
<script>try { if (localStorage.getItem('rembrandt.lamp.v01') === 'night') document.documentElement.classList.add('night'); } catch (e) { }   // the night theme before the page draws (src/lamp.js)</script>
</head>
<body class="adjust arm3">
<!-- Rembrandt · Test — the test bench: rows of hairpins on a 30 × 30 board,
     drawn by the plotter, X and Y, lines and arcs (the owner, 2026-10-02:
     the arm strokes were dropped, the board and the patterns of
     references/Screenshot 2026-10-02 3DOF.png stay). It moves the machine
     through rembrandt.py's runner. -->
<header class="top">
  <div class="brand">
    <span class="logo">REMBRANDT</span>
    <nav class="tabs" aria-label="Pages">
      <a href="index.html">Create</a>
      <a href="job.html">Job</a>
      <a href="test.html" class="on">Test</a>
      <a href="ink.html">Ink</a>
      <a href="adjustments.html">Adjustments</a>
      <a href="calibration.html">Calibration</a>
      <a href="library.html">Library</a>
    </nav>
    <span class="ver">v0.1</span>
  </div>
  <div class="top-mid"></div>
</header>

<main class="no-tools">
  <section class="stage" id="stage">
    <div class="board" id="board"><canvas id="cv"></canvas></div>
  </section>

  <aside class="panel">
    <section class="sec">
      <h3>Progress <span id="lamp"></span></h3>
      <div class="lcd" id="lcd" aria-live="polite"></div>
      <p class="runstate" id="runState"></p>
      <!-- four keys in two rows (the owner, 2026-10-02): PLAY and one key for
           Pause and Continue, then STOP and HARD STOP -->
      <div class="runkeys">
        <button class="btn" id="btnDoJob" title="Run the test on the machine">PLAY</button>
        <button class="btn" id="btnPause" title="Pause the run; pressed, Continue goes on">PAUSE</button>
      </div>
      <div class="stops">
        <button class="btn" id="btnStop" title="Stop the carriage and the arm, braking">STOP</button>
        <button class="btn danger" id="btnKill" title="Stop the carriage at once and the arm where it is">HARD STOP</button>
      </div>
    </section>

    <div class="savebar">
      <button class="btn save" id="btnSave" title="Save this test in the Library, as a new one named by the date and time">💾 SAVE TEST</button>
      <span class="save-state" id="saveState">to the Library</span>
    </div>
    <section class="sec">
      <h3>Test</h3>
      <div class="layoutbar">
        <div class="toggles" id="pat">
          <button class="tog" data-p="A" title="Tight hairpins: the owner's sketch A">A</button>
          <button class="tog" data-p="B" title="Loose hairpins: sketch B">B</button>
          <button class="tog" data-p="C" title="The snake: one continuous line, row after row">C</button>
        </div>
        <div class="toggles" id="patD">
          <button class="tog" data-d="D1" title="D1: the snake of C, its rows upright and bowed to the left — orange">D1</button>
          <button class="tog" data-d="D2" title="D2: the snake of C, its rows down to the lower right — red">D2</button>
          <button class="tog" data-d="D3" title="D3: the snake of C, its rows up to the upper right — dark grey">D3</button>
        </div>
      </div>
      <!-- INK (the owner, 2026-10-03): a row of its own under the pattern keys, a switch as
           Lift at the turns, green; OFF keeps every test as it was. Its name as the sliders'
           (Rows, Row to row), lower than the keys; OFF left of the switch, ON right of it, on the name's line -->
      <div class="inkrow" title="ON: the brush dips in the cup of the Ink tab before every row; the rows one way, back to the cup after each, home at the end">
        <span class="slh"><span>Ink</span></span>
        <div class="inline check ink"><span class="side" id="inkOff">Off</span><input id="ink" type="checkbox" aria-label="Ink"><span class="side" id="inkOn">On</span></div>
      </div>
      <div class="shifts" id="shifts"></div>
      <div class="sliders" id="sliders"></div>
      <div class="grid4" id="fields"></div>
      <label class="inline check"><input id="lift" type="checkbox"> Lift at the turns: the brush up through every turn</label>
      <label class="inline check"><input id="pause" type="checkbox"> Pause after each row: paint for the brush</label>
      <p class="read" id="planRead"></p>
    </section>

    <section class="sec">
      <h3>Here <span class="hint">the board's centre</span></h3>
      <p class="read" id="hereRead"></p>
      <button class="btn wide" id="btnHere" title="Jog the carriage on the Calibration tab until the brush is over the board's centre; then press">Here: the brush is over the board's centre</button>
    </section>

  </aside>
</main>

<footer class="status">
  <span id="hint">Test — the plotter draws each row: a line out, a half circle, a line back; the elbow eases the brush on and off on the move, and lifts it through the turns.</span>
  <span id="stats"></span>
</footer>
<script type="module" src="src/testpage.js"></script>
</body>
</html>
