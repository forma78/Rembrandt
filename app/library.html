<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rembrandt · Library</title>
<link rel="stylesheet" href="style.css">
<script>try { if (localStorage.getItem('rembrandt.lamp.v01') === 'night') document.documentElement.classList.add('night'); } catch (e) { }   // the night theme before the page draws (src/lamp.js)</script>
</head>
<body>
<!-- Rembrandt · Library (from RUBENS a143fbc) — the drawings saved with 💾 SAVE on the Create tab,
     newest first. They live on this Mac only (rembrandt.py, library/). A click
     opens one on the Create tab; × moves it to library/.deleted/. -->
<header class="top">
  <div class="brand">
    <span class="logo">REMBRANDT</span>
    <span class="ver">v0.4</span>
    <nav class="tabs" aria-label="Pages">
      <a href="index.html">TYPE</a>
      <a href="nolan.html">NOLAN</a>
      <a href="test.html">Test</a>
      <a href="ink.html">Ink</a>
      <a href="calibration.html">Calibration</a>
      <a href="library.html" class="on">Library</a>
    </nav>
  </div>
  <div class="top-mid"></div>
  <div class="top-right"></div>
</header>

<main class="lib">
  <section class="lib-grid" id="grid" aria-live="polite"></section>
  <!-- the second shelf: the tests from the Test tab (the owner, 2026-10-02) -->
  <div class="lib-split" id="split" hidden><span>Tests</span></div>
  <section class="lib-grid" id="tests" aria-live="polite"></section>
</main>

<footer class="status">
  <span id="hint">Library: every 💾 SAVE on the Create tab, newest first, and below the line every 💾 SAVE TEST. Click one to open it where it was made.</span>
  <span id="count"></span>
</footer>

<script type="module" src="src/librarypage.js"></script>
</body>
</html>
