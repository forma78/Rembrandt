<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rembrandt · NOLAN</title>
<link rel="stylesheet" href="style.css">
<script>try { if (localStorage.getItem('rembrandt.lamp.v01') === 'night') document.documentElement.classList.add('night'); } catch (e) { }   // the night theme before the page draws (src/lamp.js)</script>
</head>
<body class="adjust arm3 nolan">
<!-- Rembrandt · NOLAN — one ribbon in 3D, imprinted on the canvas (NOLAN.md
     §3.0; the owner, 2026-10-04: "yes, that is it — carry it into NOLAN").
     Built on the Test tab: its board on the canvas from the cup, PROGRESS,
     keys, INK, its sliders' words; from Create the Tools on the left. -->
<header class="top">
  <div class="brand">
    <span class="logo">REMBRANDT</span>
    <span class="ver">v.1.0.1</span>
    <nav class="tabs" aria-label="Pages">
      <a href="index.html">TYPE</a>
      <a href="love.html">LOVE</a>
      <a href="nolan.html" class="on">NOLAN</a>
      <a href="test.html">Test</a>
      <a href="ink.html">Ink</a>
      <a href="calibration.html">Calibration</a>
      <a href="library.html">Library</a>
    </nav>
  </div>
  <div class="top-mid"></div>
</header>

<main>
  <nav class="tools" aria-label="Tools">
    <button class="tool" data-tool="select" title="Select — drag a figure to move it, a square to move a point; ⇧ drag turns it in 3D, ⌥ spins it; the wheel sizes it; ⌘C ⌘V copies it down (V)">
      <svg viewBox="0 0 24 24"><path d="M5 3l13 8-6 1.5L9 19z"/></svg>
      <span>V</span>
    </button>
    <button class="tool" data-tool="pen" title="Pen — click to add a point at the ribbon's end (P)">
      <svg viewBox="0 0 24 24"><path d="M12 3l6 9-6 9-6-9z"/><path d="M12 12v9"/><circle cx="12" cy="11" r="1.4" class="dot"/></svg>
      <span>P</span>
    </button>
    <button class="tool" data-tool="brush" title="Brush — paint the ribbon in one stroke, flat, facing you; drag a square to move a point (B)">
      <svg viewBox="0 0 24 24"><path d="M20 4l-6.5 6.5"/><path d="M11.5 9.5l3 3-2.5 2.5-3-3z"/><path d="M9 12c-3 .5-4.5 3-5 8 4.5-.5 7.5-2 8-5" class="dot"/></svg>
      <span>B</span>
    </button>
    <button class="tool" data-tool="circle" title="Circle — press at the centre and drag out to the radius: a flat ring; ⌘C ⌘V copies it down (O)">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7.5"/><circle cx="12" cy="12" r="1.4" class="dot"/></svg>
      <span>O</span>
    </button>
    <button class="tool" data-tool="cut" title="Cut — the layers: click the ribbon to cut it there; drag a cut's circle along it; ⌫ takes the picked cut out (C)">
      <svg viewBox="0 0 24 24"><circle cx="6" cy="7" r="3"/><circle cx="6" cy="17" r="3"/><path d="M8.5 8.8L20 17M8.5 15.2L20 7"/></svg>
      <span>C</span>
    </button>
    <div class="sep"></div>
    <button class="tool" id="btnUndo" title="Undo (⌘Z)"><svg viewBox="0 0 24 24"><path d="M9 7L4 12l5 5"/><path d="M4 12h10a6 6 0 0 1 0 12"/></svg></button>
    <button class="tool" id="btnRedo" title="Redo (⇧⌘Z)"><svg viewBox="0 0 24 24"><path d="M15 7l5 5-5 5"/><path d="M20 12H10a6 6 0 0 0 0 12"/></svg></button>
    <button class="tool" id="btnDel" title="Delete the picked point, or the picked figure when it is picked whole — or with Cut the picked cut (⌫)"><svg viewBox="0 0 24 24"><path d="M5 7h14M9 7V4h6v3M7 7l1 13h8l1-13"/></svg></button>
    <div class="sep"></div>
    <button class="tool" id="btnDefault" title="The ribbon through IMG_9424"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7"/><path d="M6 10v10h12V10"/></svg></button>
    <button class="tool" id="btnRing" title="A ring — the donut — as the centre's blank"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="3"/></svg></button>
    <button class="tool" id="btnClear" title="Clear the canvas: no figures; then the Brush, the Circle or the Pen paints a new one (⌘Z brings them back)"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="1"/><path d="M8 8l8 8M16 8l-8 8"/></svg></button>
  </nav>

  <section class="stage t-select" id="stage">
    <div class="board" id="board"><canvas id="cv"></canvas></div>
  </section>

  <aside class="panel">
    <section class="sec">
      <h3>Progress <span id="lamp"></span></h3>
      <div class="lcd" id="lcd" aria-live="polite"></div>
      <p class="runstate" id="runState"></p>
      <div class="runkeys">
        <button class="btn" id="btnTest" title="Before PLAY: one dip in the cup, a dot 20 mm in from each corner of the board — TL, TR, BR, BL — and home">TEST</button>
        <button class="btn" id="btnDoJob" title="Run the imprint on the machine, layer by layer">PLAY</button>
        <button class="btn" id="btnPause" title="Pause the run; pressed, Continue goes on">PAUSE</button>
      </div>
      <div class="stops">
        <button class="btn" id="btnStop" title="Stop the carriage and the arm, braking">STOP</button>
        <button class="btn danger" id="btnKill" title="Stop the carriage at once and the arm where it is">HARD STOP</button>
      </div>
    </section>

    <div class="savebar">
      <button class="btn save" id="btnSave" title="Save the ribbon in the Library, as a new one named by the date and time">💾 SAVE NOLAN</button>
      <span class="save-state" id="saveState">to the Library</span>
    </div>
    <section class="sec">
      <h3>Nolan</h3>
      <!-- the cuts: Auto, Uncut; Pass through. Every layer runs, no N1 · N2 · N3 keys (2026-10-05) -->
      <div class="toggles looks" id="layerKeys" hidden></div>
      <!-- INK as on Test: ON the Watercolour run — a dip in the cup every dip run along a row;
           OFF the Paint run, the paint on the canvas -->
      <div class="inkrow" title="ON: the brush dips in the cup of the Ink tab, a dip every 720 mm along a row (est.), none before a piece under 75 mm, the layers one after another with no pause; OFF: the paint on the canvas, a pause between the layers">
        <span class="slh"><span>Ink</span></span>
        <div class="inline check ink"><span class="side" id="inkOff">Off</span><input id="ink" type="checkbox" aria-label="Ink"><span class="side" id="inkOn">On</span></div>
      </div>
      <div class="toggles looks" id="looks">
        <button class="tog" data-look="geometry" title="The rows on the canvas; red where they lie closer than a row's width">Geometry</button>
        <button class="tog" data-look="colour" title="The rows in IMG_9424's stripes; the band's back darker — the glazes">Colour</button>
        <button class="tog" data-look="layers" title="What lies over what: painted in this order, each once the one under it is dry">Layers</button>
        <button class="tog" data-look="imprint" title="What the machine paints: the visible pieces of the rows, their tails thinning; with INK ON the watercolour as it lies on the paper">Imprint</button>
      </div>
      <div class="toggles looks" id="grounds">
        <button class="tog" data-ground="white" title="The white canvas, as the machine paints it">White</button>
        <button class="tog" data-ground="black" title="The black ground, as after the owner's hand">Black</button>
      </div>
      <div class="sliders" id="slBand"></div>
      <h4>The ribbon in space</h4>
      <div class="sliders" id="slView"></div>
      <div class="grid4 three" id="viewFields"></div>
      <div class="sliders" id="slLens"></div>
      <div class="grid4 keys">
        <button class="btn" id="btnFront" title="Turned back to face the canvas, as drawn">Face the canvas</button>
        <button class="btn" id="btnPaste" title="A shape copied from the prototype (Copy the shape)">Paste a shape</button>
      </div>
      <h4 id="ptHead">Point</h4>
      <div class="sliders" id="slPoint"></div>
      <h4>The brush</h4>
      <div class="sliders" id="slRun"></div>
      <h4>Canvas <button class="info" id="planInfo" title="The plan: the imprint, the run, where the canvas lies from home">i</button></h4>
      <div class="grid4" id="fields"></div>
      <p class="read" id="planRead" hidden></p>
      <p class="read" id="planWarn" hidden></p>
    </section>

    <section class="sec">
      <h3>Reference <span class="hint">over the canvas, as tracing paper</span></h3>
      <div class="refrow">
        <div class="refthumb" id="refThumb"><span>no reference yet</span></div>
        <div class="refctl">
          <button class="btn" id="btnRef" title="An image over the canvas, to fit the ribbon to: never painted as is">📎 Add new reference</button>
          <p class="read" id="refRead"></p>
          <input id="refOp" type="range" min="0" max="100" step="1" class="slider" aria-label="Opacity of the reference">
        </div>
      </div>
      <input type="file" id="refIn" accept="image/*" hidden>
    </section>
  </aside>
</main>

<footer class="status">
  <span id="hint"></span>
  <span id="stats"></span>
</footer>
<script type="module" src="src/nolan.js"></script>
</body>
</html>
