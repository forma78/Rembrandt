<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rembrandt · LOOM</title>
<link rel="stylesheet" href="style.css">
<script>try { if (localStorage.getItem('rembrandt.lamp.v01') === 'night') document.documentElement.classList.add('night'); } catch (e) { }   // the night theme before the page draws (src/lamp.js)</script>
</head>
<body class="adjust arm3 nolan type love alu ccd" data-tab="loom">
<!-- Rembrandt · LOOM — Claude's own tab (the owner, 2026-10-16, Claude-Freedome/:
     "full freedom: study the result yourself and come up with a tab entirely
     your own"). The canvas one woven cloth: BIAS SNAKE's strips at 45°, the
     elbow hopping over the strips a strip goes under — Plain, Twill, Basket,
     Lattice; two layers, each its own drawing and paints, the second over the
     first set; a canvas past the reach in two halves, turned round between
     (src/loomplan.js). -->
<header class="top">
  <div class="brand">
    <span class="logo">REMBRANDT</span>
    <span class="ver">v.1.1.3</span>
    <nav class="tabs" aria-label="Pages">
      <a href="index.html">INKA</a>
      <a href="stjohn.html">ST-JOHN</a>
      <a href="blend.html">BLEND</a>
      <a href="dache.html">DACHE</a>
      <a href="prisma.html">PRISMA</a>
      <a href="alucut.html">ALU-CUT</a>
      <a href="ccd.html">CCD</a>
      <a href="ink.html">Ink</a>
      <a href="calibration.html">Calibration</a>
      <a href="library.html">Library</a>
      <a href="prefs.html" class="gear" title="Preferences" aria-label="Preferences"></a>
    </nav>
    <script src="src/tabs.js"></script>   <!-- the row as Preferences have it (src/tabs.js) -->
  </div>
  <div class="top-mid"></div>
</header>

<main>
  <nav class="tools" aria-label="Tools">
    <!-- the sausages by hand: a paint in the strip, then a click on a stripe of an edge or a row -->
    <button class="tool" data-tool="paint" title="Sausages — a click on a stripe of an edge or a row puts a sausage of the chosen paint there, on the layer chosen; a click with the paint it has takes it away; the Result drags them (M)">
      <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="0.5" class="thin"/><path d="M4 9v6M9 20h6M20 6v5M12 9v6" class="bold"/></svg>
      <span>M</span>
    </button>
    <button class="tool" id="btnPaintsClear" title="Clear the chosen layer's sausages (⌘Z brings them back)"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="1"/><path d="M8 8l8 8M16 8l-8 8"/></svg></button>
    <div class="sep"></div>
    <button class="tool" id="btnUndo" title="Undo (⌘Z)"><svg viewBox="0 0 24 24"><path d="M9 7L4 12l5 5"/><path d="M4 12h10a6 6 0 0 1 0 12"/></svg></button>
    <button class="tool" id="btnRedo" title="Redo (⇧⌘Z)"><svg viewBox="0 0 24 24"><path d="M15 7l5 5-5 5"/><path d="M20 12H10a6 6 0 0 0 0 12"/></svg></button>
  </nav>

  <div class="zoombar" id="zoombar">
    <button class="zk" id="zoomOut" title="Zoom out (⌘−)" aria-label="Zoom out"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
    <button class="zk pct" id="zoomFit" title="Back to 100 %: the canvas and home (⌘0)">100%</button>
    <button class="zk" id="zoomIn" title="Zoom in (⌘+). A pinch on the trackpad zooms where it is; two fingers move the board" aria-label="Zoom in"><svg viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></svg></button>
  </div>

  <section class="stage" id="stage">
    <div class="paintstrip" id="paints" aria-label="Paints"></div>
    <div class="board" id="board"><canvas id="cv"></canvas><div class="spoke-tip" id="spokeTip" hidden></div></div>
  </section>

  <aside class="panel">
    <section class="sec">
      <h3>Progress <span id="lamp"></span></h3>
      <div class="lcd" id="lcd" aria-live="polite"></div>
      <p class="runstate" id="runState"></p>
      <div class="runkeys deck">
        <button class="btn" id="btnTest" title="TEST, before the runs: with INK ON one dip in the cup, a dot 20 mm in from each corner of what this run paints — the canvas, or its near half — and home"><svg viewBox="0 0 24 24"><rect x="4.5" y="4.5" width="15" height="15" rx="1" class="thin"/><circle cx="8" cy="8" r="1.7" class="dot"/><circle cx="16" cy="8" r="1.7" class="dot"/><circle cx="16" cy="16" r="1.7" class="dot"/><circle cx="8" cy="16" r="1.7" class="dot"/></svg><span>Test</span></button>
        <button class="btn" id="btnPause" title="PAUSE the run at the end of the lane; pressed, CONT. goes on"><svg viewBox="0 0 24 24" class="i-pause"><path d="M9 6v12M15 6v12" class="bold"/></svg><svg viewBox="0 0 24 24" class="i-cont"><path d="M8.5 6l10 6-10 6z" class="fill"/></svg><span>Pause</span></button>
      </div>
      <!-- MARKS and DRAG in two keys, BIAS SNAKE's and BIAS AIR's way, for the layer chosen -->
      <div class="runkeys deck passes">
        <button class="btn pass" id="btnMarks" data-pass="marks" title="MARKS, the layer chosen: a dash where every sausage goes, along its edge or row — with INK ON in watercolour from the cup, a dip every fourth; then squeeze the sausages on them"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="0.5" class="thin"/><path d="M4 9v6M9 20h6M20 6v5"/></svg><span>Marks</span></button>
        <button class="btn pass" id="btnSnake" data-pass="snake" title="DRAG the layer chosen, the snake: a rising strip, a crossing one, in turn, every one 30 mm off the canvas at both ends; the brush down off the canvas from one to the next where it can go round, else up and over; over a strip it goes under, the elbow lifts it on the move and lands it past; no dip"><svg viewBox="0 0 24 24"><path d="M2 17l7-10h3l-7 10h3l7-10h3l-7 10"/></svg><span>Snake</span></button>
        <button class="btn pass" id="btnAir" data-pass="air" title="DRAG the layer chosen through the air: a rising strip, a crossing one, in turn, each one way, landing and lifting 30 mm off the canvas, the hops as the snake's; no dip"><svg viewBox="0 0 24 24"><path d="M5 17L16 6M10 6h6v6"/><path d="M5 7l11 11M16 12v6h-6" class="thin"/></svg><span>Air</span></button>
      </div>
      <div class="stops deckstops">
        <button class="btn" id="btnStop" title="Stop the carriage and the arm, braking (Esc)">STOP</button>
        <button class="btn" id="btnHome" title="HOME: the brush up, the carriage back to home — the bottom left corner; when nothing runs">HOME</button>
      </div>
      <div class="inkrow" title="ON: MARKS in watercolour, dipping in the cup of the Ink tab, and TEST's dip; OFF: no dip. DRAG never dips">
        <span class="slh"><span>Ink</span></span>
        <div class="inline check ink"><span class="side" id="inkOff">Off</span><input id="ink" type="checkbox" aria-label="Ink"><span class="side" id="inkOn">On</span></div>
      </div>
      <div class="toggles looks" id="views">
        <button class="tog" data-view="drag" title="DRAG: the chosen layer's strips as the brush lays them — the gaps where it hops — the sausages where you squeeze them, MARKS' dashes under them">Drag</button>
        <button class="tog" data-view="result" title="The painting: layer 1, and on Layer 2 the second over it, the sausages dragged strip after strip, the brush up over the hops (est.)">Result</button>
      </div>
      <div class="toggles looks" id="modeKeys" title="Drag and the Result as this DRAG runs; the LCD's numbers too">
        <button class="tog" data-mode="snake">Snake</button><button class="tog" data-mode="air">Air</button>
      </div>
    </section>

    <div class="savebar">
      <button class="btn save" id="btnSave" title="Save both layers in the Library, as a new save named by the date and time">💾 SAVE LOOM</button>
      <span class="save-state" id="saveState">to the Library</span>
    </div>
    <section class="sec">
      <h3>LOOM <span class="hint">a woven cloth, Claude's</span> <button class="info" id="loomInfo" title="What LOOM does, and why">i</button></h3>
      <p class="read" id="loomRead" hidden></p>
      <!-- two layers, two runs: the owner, 2026-10-16, IMG_0921: "two independent runs, and it looks dearer than one" -->
      <div class="toggles looks" id="layerKeys">
        <button class="tog" data-layer="0" title="Layer 1: its own drawing and paints, on the white canvas">Layer 1</button>
        <button class="tog" data-layer="1" title="Layer 2: another drawing, another way, its own paints — over layer 1 once it has set">Layer 2</button>
      </div>
      <h4 class="first">Weave <span class="hint" id="weaveOf"></span></h4>
      <div class="toggles looks" id="weaveKeys">
        <button class="tog" data-weave="plain" title="Plain: one over, one under, in turn like a chessboard — the intrecciato. The brush lifts over every other strip it crosses">Plain</button>
        <button class="tog" data-weave="twill" title="Twill: two over, two under — at 45° its ribs run straight across the canvas">Twill</button>
        <button class="tog" data-weave="basket" title="Basket: the strips in pairs, two over two">Basket</button>
        <button class="tog" data-weave="lattice" title="Lattice: no hop — the later strip always on top, as BIAS SNAKE and IMG_0924">Lattice</button>
      </div>
      <div class="toggles looks" id="fromKeys" title="Where the crossing strips start — the rising ones from the bottom right corner always, as BIAS SNAKE">
        <button class="tog" data-from="tr" title="The crossing strips from the top right corner down, each ↘ to the right side — IMG_0924's">Crossing ↘ from top right</button>
        <button class="tog" data-from="bl" title="The crossing strips from the bottom left corner up, each ↖ — the paint dragged the other way">↖ from bottom left</button>
      </div>
      <div class="sliders" id="clothSl"></div>
      <p class="read" id="clothRead"></p>
      <h4>Paints <span class="hint" id="paintsOf"></span> <button class="info" id="paintInfo" title="The sausages: the edges and the rows, the tone, its seed">i</button></h4>
      <div class="toggles looks wrap" id="toneKeys"></div>
      <div class="grid4 keys"><button class="btn" id="btnNewColours" title="A palette at random, after the striped canvases of TAPE-colors/, in your paints; the sausages stay in their places — or, none lying, the pattern laid (⌘Z goes back)">New colours</button><button class="btn" id="btnNewSpokes" title="The pattern anew on this layer: the edges and the rows cut into stripes again, a sausage each; the palette as it is (⌘Z goes back)">New spokes</button></div>
      <div class="sliders" id="slPaint"></div>
      <div class="paintlist" id="paintList"></div>
      <p class="read" id="paintRead" hidden></p>
      <h4>Canvas past the reach</h4>
      <div class="toggles looks" id="halfKeys">
        <button class="tog" data-halves="one" title="The whole canvas in one run">One run</button>
        <button class="tog" data-halves="lr" title="Two halves across: the left half and the overlap; the canvas turned round 180°; the other half the same way">Halves ↔</button>
        <button class="tog" data-halves="bt" title="Two halves up the machine: the bottom half and the overlap; the canvas turned round 180°; the other half the same way">Halves ↕</button>
      </div>
      <p class="read" id="halfRead"></p>
      <h4>Brush, DRAG</h4>
      <div class="sliders" id="slBrush"></div>
      <h4>Canvas <button class="info" id="planInfo" title="The plan: the layers, their strips and hops, where the canvas lies from home">i</button></h4>
      <div class="grid4" id="fields"></div>
      <p class="read" id="planRead" hidden></p>
      <p class="read" id="planWarn" hidden></p>
      <h4>Files for the machine</h4>
      <div class="filekeys" id="files"></div>
      <p class="read" id="fileRead"></p>
    </section>

    <section class="sec">
      <h3>Reference <span class="hint">over the canvas, as tracing paper</span></h3>
      <div class="refrow">
        <div class="refthumb" id="refThumb"><span>no reference yet</span></div>
        <div class="refctl">
          <button class="btn" id="btnRef" title="An image over the canvas, to lay the cloth to: never painted as is">📎 Add new reference</button>
          <p class="read" id="refRead"></p>
          <input id="refOp" type="range" min="0" max="100" step="1" class="slider" aria-label="Opacity of the reference">
        </div>
      </div>
      <input type="file" id="refIn" accept="image/*" hidden>
    </section>
  </aside>
</main>

<footer class="status">
  <span id="hint"></span>
  <span id="stats"></span>
</footer>
<script type="module" src="src/loom.js"></script>
</body>
</html>
