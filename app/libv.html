<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rembrandt · LIB-V</title>
<link rel="stylesheet" href="style.css">
<script>try { if (localStorage.getItem('rembrandt.lamp.v01') === 'night') document.documentElement.classList.add('night'); } catch (e) { }   // the night theme before the page draws (src/lamp.js)</script>
<style>
  .card .badge{position:absolute;left:8px;top:8px;padding:1px 6px;border-radius:4px;background:var(--panel);color:var(--mute);font:600 9px var(--mono);letter-spacing:.1em;text-transform:uppercase}
  .card{position:relative}
  /* 💎, a canvas finished each (2026-11-22): a row of its own, +💎 at its end */
  .card .gems{display:flex;flex-wrap:wrap;align-items:center;gap:2px;margin-top:6px;font-size:14px;line-height:18px}
  .card .gems b{font-weight:normal;cursor:pointer}
  .card .gem-add{margin-left:4px;padding:0 6px;border:1px solid var(--line);border-radius:9px;background:none;color:var(--mute);font:500 10px/16px var(--mono);cursor:pointer}
  .card .gem-add:hover{color:var(--ink);border-color:var(--ink)}
</style>
</head>
<body>
<!-- Rembrandt · LIB-V (the owner, 2026-11-22, the evening: "make Library-V as here", Library's page, GOGH/Screenshot 2026-11-22 at 9.19.58 PM.png; of
     THE JARS' 💾 SAVE, a file in Downloads: "I need it in the library"): GOGH's pictures, newest first — GEN-V's 🐾 APPROVE puts one here — and below
     the line every 💾 SAVE of a picture's jars on GOGH. A click opens it on GOGH; × moves one of this Mac's into app/gogh/.deleted/. src/libv.js;
     rembrandt.py's /gogh/library, /gogh/jars. -->
<header class="top">
  <div class="brand">
    <span class="logo">REMBRANDT</span>
    <span class="ver">v.1.2.8</span>
    <nav class="tabs" aria-label="Pages">
      <a href="gogh.html">GOGH</a>
      <a href="genv.html">GEN-V</a>
      <a href="libv.html" class="on">LIB-V</a>
      <a href="library.html">Library</a>
      <a href="prefs.html" class="gear" title="Preferences" aria-label="Preferences"></a>
    </nav>
    <script src="src/tabs.js"></script>   <!-- the row as Preferences have it (src/tabs.js) -->
  </div>
  <div class="top-mid"></div>
  <div class="top-right"></div>
</header>

<main class="lib">
  <section class="lib-grid" id="grid" aria-live="polite"></section>
  <div class="lib-split" id="split" hidden><span>Jars</span></div>
  <section class="lib-grid" id="jars" aria-live="polite"></section>
</main>

<footer class="status">
  <span id="hint">LIB-V: GOGH's pictures, GEN-V's 🐾 APPROVE first; below the line every 💾 SAVE of a picture's jars. Click one to open it on GOGH.</span>
  <span id="count"></span>
</footer>

<script type="module" src="src/libv.js"></script>
</body>
</html>
