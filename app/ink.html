<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rembrandt · Ink</title>
<link rel="stylesheet" href="style.css">
<script>try { if (localStorage.getItem('rembrandt.lamp.v01') === 'night') document.documentElement.classList.add('night'); } catch (e) { }   // the night theme before the page draws (src/lamp.js)</script>
</head>
<body>
<!-- Rembrandt · Ink — where the brush takes its paint (the owner,
     2026-10-03): one cup for now, later the dip station's cups. INK ON on
     the Test tab dips into it. The page moves nothing; it reads where the
     carriage is. -->
<header class="top">
  <div class="brand">
    <span class="logo">REMBRANDT</span>
    <nav class="tabs" aria-label="Pages">
      <a href="index.html">Create</a>
      <a href="job.html">Job</a>
      <a href="test.html">Test</a>
      <a href="ink.html" class="on">Ink</a>
      <a href="adjustments.html">Adjustments</a>
      <a href="calibration.html">Calibration</a>
      <a href="library.html">Library</a>
    </nav>
    <span class="ver">v0.1</span>
  </div>
  <div class="top-mid"></div>
  <div class="top-right">
    <span class="link-state" id="linkState">…</span>
  </div>
</header>

<main class="cal">
  <section class="stage" id="stage">
    <canvas id="top"></canvas>
  </section>

  <aside class="panel">
    <section class="sec">
      <h3>Cup <span class="hint">the first of the dip station</span></h3>
      <p class="read" id="cupRead"></p>
      <button class="btn wide" id="btnCup" title="Jog the carriage on the Calibration tab until the brush, down in the cup, is over its centre; then press">Here: the brush is over the cup's centre</button>
      <div class="grid4" id="size"></div>
    </section>

    <section class="sec">
      <h3>The dip <span class="hint">the elbow</span></h3>
      <div class="grid4" id="dip"></div>
      <p class="read" id="dipRead"></p>
    </section>
  </aside>
</main>

<footer class="status">
  <span id="hint">Ink — where the brush takes its paint: the cup, and how the elbow dips into it. INK ON on the Test tab dips there before every row.</span>
  <span id="saved"></span>
</footer>
<script type="module" src="src/inkpage.js"></script>
</body>
</html>
