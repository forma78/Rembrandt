<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rembrandt · TAPE</title>
<link rel="stylesheet" href="style.css">
<script>try { if (localStorage.getItem('rembrandt.lamp.v01') === 'night') document.documentElement.classList.add('night'); } catch (e) { }   // the night theme before the page draws (src/lamp.js)</script>
</head>
<body class="adjust arm3 nolan type love alu ccd tape" data-tab="tape">
<!-- Rembrandt · TAPE — a cassette in the centre, its tape wound round it, the
     first tab from 2026-10-12 to 10-19, tape.html and off the top row since
     (the owner, TAPE-Claude/: "a hand-painted
     cassette in the centre, the tape painted by the machine with the brush";
     "only to restore Soumkine, on Etsy"). TRACE draws the cassette's outline
     and the tape's guide with the brush — with INK ON in watercolour from the
     cup; DRAG paints the tape segment by segment, in two keys, the snake and
     through the air; the cassette is coloured by hand last. The plan in
     src/tapeplan.js, chat-Claude's prototype v0.3 ported. CCD's page: its
     board, the canvas from home, PROGRESS, TEST, PAUSE, the LCD, the zoom. -->
<header class="top">
  <div class="brand">
    <span class="logo">REMBRANDT</span>
    <span class="ver">v.1.0.9</span>
    <nav class="tabs" aria-label="Pages">
      <a href="index.html">INKA</a>
      <a href="alucut.html">ALU-CUT</a>
      <a href="ccd.html">CCD</a>
      <a href="bias.html">BIAS</a>
      <a href="alu.html">ALU</a>
      <a href="smkn.html">SMKN</a>
      <a href="ink.html">Ink</a>
      <a href="calibration.html">Calibration</a>
      <a href="library.html">Library</a>
    </nav>
  </div>
  <div class="top-mid"></div>
</header>

<main>
  <nav class="tools" aria-label="Tools">
    <!-- the spokes (the owner, 2026-10-12, TAPE-images/ 17:22: the paint squeezed across the lanes, from the cassette out; "I try to mix as Florian
         does, but I lack a layout of the real paints I have"): a paint in the strip, then a click on the tape -->
    <button class="tool" data-tool="spoke" title="Spokes — a click on the tape lays a spoke of the chosen paint over the 6 lanes there (1 … 6, 7 … 12 …), lined up with one lying there; a drag from lane to lane, 6 at most; a click on a spoke takes it away; the Result mixes them as the brush goes (M)">
      <svg viewBox="0 0 24 24"><path d="M3 8h18M3 16h18"/><path d="M9 5v14M15 5v14" class="bold"/></svg>
      <span>M</span>
    </button>
    <button class="tool" id="btnSpokesClear" title="Clear the spokes (⌘Z brings them back)"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="1"/><path d="M8 8l8 8M16 8l-8 8"/></svg></button>
    <div class="sep"></div>
    <button class="tool" id="btnUndo" title="Undo (⌘Z)"><svg viewBox="0 0 24 24"><path d="M9 7L4 12l5 5"/><path d="M4 12h10a6 6 0 0 1 0 12"/></svg></button>
    <button class="tool" id="btnRedo" title="Redo (⇧⌘Z)"><svg viewBox="0 0 24 24"><path d="M15 7l5 5-5 5"/><path d="M20 12H10a6 6 0 0 0 0 12"/></svg></button>
    <div class="sep"></div>
    <!-- the colours, for the Result only (the prototype's): the ground and the tape, a chip each -->
    <div class="ground" title="The colours of the Result: they move nothing on the machine">
      <span class="glab">ground</span>
      <label class="gc" title="The ground's colour, for the Result"><span class="sw" id="swGround"></span><input type="color" id="colGround" aria-label="Ground colour"></label>
      <span class="glab">tape</span>
      <label class="gc" title="The tape's colour, for the Result"><span class="sw" id="swTape"></span><input type="color" id="colTape" aria-label="Tape colour"></label>
    </div>
  </nav>

  <!-- the zoom, over the board, as on CCD -->
  <div class="zoombar" id="zoombar">
    <button class="zk" id="zoomOut" title="Zoom out (⌘−)" aria-label="Zoom out"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
    <button class="zk pct" id="zoomFit" title="Back to 100 %: the canvas and home (⌘0)">100%</button>
    <button class="zk" id="zoomIn" title="Zoom in (⌘+). A pinch on the trackpad zooms where it is; two fingers move the board" aria-label="Zoom in"><svg viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></svg></button>
  </div>

  <section class="stage" id="stage">
    <!-- the owner's paints, a strip by the Tools as ALU's tubes: a chip a paint, its name on hover, how many spokes it has under it -->
    <div class="paintstrip" id="paints" aria-label="Paints"></div>
    <div class="board" id="board"><canvas id="cv"></canvas><div class="spoke-tip" id="spokeTip" hidden></div></div>
  </section>

  <aside class="panel">
    <section class="sec">
      <h3>Progress <span id="lamp"></span></h3>
      <div class="lcd" id="lcd" aria-live="polite"></div>
      <p class="runstate" id="runState"></p>
      <!-- the cassette deck, CCD's: TEST and PAUSE; TRACE, then DRAG in two keys, the snake and through the air
           (the owner, 2026-10-12: "Marks is not needed, we do not put it in the software"; "but two Drag — the snake,
           and there along the canvas, back through the air") -->
      <div class="runkeys deck">
        <button class="btn" id="btnTest" title="TEST, before the passes: a dot 20 mm in from each corner of the board — TL, TR, BR, BL — and home; with INK ON one dip in the cup first"><svg viewBox="0 0 24 24"><rect x="4.5" y="4.5" width="15" height="15" rx="1" class="thin"/><circle cx="8" cy="8" r="1.7" class="dot"/><circle cx="16" cy="8" r="1.7" class="dot"/><circle cx="16" cy="16" r="1.7" class="dot"/><circle cx="8" cy="16" r="1.7" class="dot"/></svg><span>Test</span></button>
        <button class="btn" id="btnPause" title="PAUSE the run — on DRAG where the tape passes the seam, a lap's end; pressed, CONT. goes on"><svg viewBox="0 0 24 24" class="i-pause"><path d="M9 6v12M15 6v12" class="bold"/></svg><svg viewBox="0 0 24 24" class="i-cont"><path d="M8.5 6l10 6-10 6z" class="fill"/></svg><span>Pause</span></button>
      </div>
      <div class="runkeys deck passes">
        <button class="btn pass" id="btnTrace" data-pass="trace" title="TRACE: the cassette's outline and the tape's guide with the brush — with INK ON in watercolour from the cup"><svg viewBox="0 0 24 24"><rect x="6.5" y="8" width="11" height="8" rx="1"/><path d="M3.5 5h17v14h-17z" class="dash"/></svg><span>Trace</span></button>
        <button class="btn pass" id="btnSnake" data-pass="snake" title="DRAG, the snake: the tape forward, back, forward … with the brush down, as many strokes as Strokes; no stop, no dip"><svg viewBox="0 0 24 24"><path d="M4 7h14a2.5 2.5 0 0 1 0 5H6a2.5 2.5 0 0 0 0 5h14"/></svg><span>Snake</span></button>
        <button class="btn pass" id="btnAir" data-pass="air" title="DRAG through the air: the tape forward, the brush lifting at its end and flying back to its start, as many strokes as Strokes; no stop, no dip"><svg viewBox="0 0 24 24"><path d="M4 16h14M15 13l3 3-3 3"/><path d="M18 8H6" class="dash"/><path d="M8 5l-3 3 3 3" class="thin"/></svg><span>Air</span></button>
      </div>
      <div class="stops deckstops">
        <button class="btn" id="btnStop" title="Stop the carriage and the arm, braking (Esc)">STOP</button>
        <button class="btn" id="btnHome" title="HOME: the brush up, the carriage back to home — the bottom left corner; when nothing runs">HOME</button>
      </div>
    </section>

    <div class="savebar">
      <button class="btn save" id="btnSave" title="Save the tape in the Library, as a new save named by the date and time">💾 SAVE TAPE</button>
      <span class="save-state" id="saveState">to the Library</span>
    </div>
    <section class="sec">
      <h3>TAPE <span class="hint">a cassette, its tape round it</span></h3>
      <!-- INK, ALU's: ON TRACE in watercolour from the cup of the Ink tab; OFF no dip; DRAG never dips -->
      <div class="inkrow" title="ON: TRACE in watercolour, dipping in the cup of the Ink tab; OFF: no dip. DRAG never dips">
        <span class="slh"><span>Ink</span></span>
        <div class="inline check ink"><span class="side" id="inkOff">Off</span><input id="ink" type="checkbox" aria-label="Ink"><span class="side" id="inkOn">On</span></div>
      </div>
      <!-- the passes as they will look; a view only -->
      <div class="toggles looks" id="views">
        <button class="tog" data-view="trace" title="TRACE: the cassette's outline and the tape's guide, the rest of the cassette faint — drawn by hand with a stencil">Trace</button>
        <button class="tog" data-view="drag" title="DRAG: the tape's centre line, the brush's path, numbered where it starts; dashed where the brush flies">Drag</button>
        <button class="tog" data-view="result" title="The painting: the tape as the brush leaves it, the cassette filled light; the lanes past the canvas faint">Result</button>
      </div>
      <div class="grid4 keys"><button class="btn" id="btnPlay" title="The brush through the run, segment after segment, about 30 times as fast; pressed again, it stops. A view: it moves nothing on the machine">▶ Play the run</button></div>
      <p class="read" id="playRead"></p>

      <h4>Paints <button class="info" id="paintInfo" title="The spokes, where you squeeze the paints: how to lay them, the palette, its seed">i</button></h4>
      <!-- New colours as ALU's (the owner, 2026-10-12, TAPE-colors/: "click a key and the palette changes at random") -->
      <div class="grid4 keys"><button class="btn" id="btnNewColours" title="A palette at random, after the striped canvases of TAPE-colors/, in your paints; the spokes stay in their places — or, none lying, the pattern is laid (⌘Z goes back)">New colours</button><button class="btn" id="btnNewSpokes" title="The pattern: stripes of 1, 2, 3 or 6 lanes mixed anew, through two spots at every corner and more where a lane would go 70 mm without paint — the brush runs out there; the palette as it is (⌘Z goes back)">New spokes</button></div>
      <!-- the owner's two ideals, TAPE-colors/meta-tape-01.jpg and -02.jpg ("new keys, meta 1 and meta 2"): a press a new deal in their paints -->
      <div class="toggles looks" id="metaKeys">
        <button class="tog" data-meta="meta 1" title="meta-tape-01: ultramarine, the blues, sky, white, black; orange, orange yellow and purple flecks; the first ring light">meta 1</button>
        <button class="tog" data-meta="meta 2" title="meta-tape-02: purple, black, pink, sand, white, orange; ochre, ultramarine, red and rose azo threads; the first ring gold">meta 2</button>
      </div>
      <div class="sliders" id="slPaint"></div>
      <div class="paintlist" id="paintList"></div>
      <p class="read" id="paintRead" hidden></p>

      <div id="cassSec">
      <h4>Cassette</h4>
      <div class="grid4 keys"><button class="btn" id="btnCassDefault" title="The built-in cassette, cassette_trace.svg: a real shell, 100.4 × 63.8 mm">Default</button><button class="btn" id="btnCassLoad" title="Another cassette's SVG for this tape: its outlines traced, its size from its width in mm or cm">Load SVG…</button></div>
      <input type="file" id="cassIn" accept=".svg,image/svg+xml" hidden>
      <p class="read" id="cassRead"></p>
      </div>

      <h4>Trace</h4>
      <div class="toggles looks" id="traceKeys">
        <button class="tog" data-trace="traceCass" title="The cassette's outline, its shell, the box the tape hugs: round from 12 o'clock and on over its start; the rest drawn by hand with a stencil">Cassette outline</button>
        <button class="tog" data-trace="traceTape" title="The tape's guide: every run's centre line on the canvas, the very line DRAG runs">Tape guide</button>
      </div>
      <div class="sliders" id="slTrace"></div>

      <h4>Brush, DRAG</h4>
      <div class="sliders" id="slBrush"></div>
      <div class="scale" id="cornersScale"><span>Angle</span><span>Cassette</span><span>Round</span></div>
      <div class="toggles looks" id="seamKeys">
        <button class="tog" data-seam="shift" title="The tape moves out to the next lane over the lane change, from the middle of the right side; long enough, one continuous spiral">Lane change</button>
        <button class="tog" data-seam="closed" title="Every lane closes on itself; the brush lifts to the next">Closed rings</button>
      </div>
      <div class="toggles looks" id="dirKeys">
        <button class="tog" data-dir="cw" title="Clockwise on the canvas: the tape, and TRACE's cassette as its file draws it">Clockwise</button>
        <button class="tog" data-dir="ccw" title="Counter-clockwise: the tape mirrored top to bottom, the seam staying on the right; TRACE's cassette the other way round too">Counter</button>
      </div>

      <h4>Adjustments</h4>
      <div class="sliders" id="slAdjust"></div>
      <div class="toggles looks" id="typeKeys">
        <button class="tog" data-btype="round" title="A round brush: the tape as wide every way it runs">Round</button>
        <button class="tog" data-btype="flat" title="A flat brush, no servo turning it: the tape's width changes with the way it runs (the Result only)">Flat</button>
      </div>
      <div class="sliders" id="slFlat"></div>

      <h4>Canvas <button class="info" id="planInfo" title="The plan: the lanes, the segments, the times, where the canvas lies from home">i</button></h4>
      <div class="grid4" id="fields"></div>
      <p class="read" id="planRead"></p>
      <p class="read" id="planMore" hidden></p>
      <p class="read" id="planWarn" hidden></p>
    </section>
  </aside>
</main>

<footer class="status">
  <span id="hint"></span>
  <span id="stats"></span>
</footer>
<script type="module" src="src/tape.js"></script>
</body>
</html>
