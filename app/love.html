<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rembrandt · LOVE</title>
<link rel="stylesheet" href="style.css">
<script>try { if (localStorage.getItem('rembrandt.lamp.v01') === 'night') document.documentElement.classList.add('night'); } catch (e) { }   // the night theme before the page draws (src/lamp.js)</script>
</head>
<body class="adjust arm3 nolan type love">
<!-- Rembrandt · LOVE — a copy of TYPE where the new things are tried, TYPE
     kept as it is to go back to (the owner, 2026-10-07: "I would duplicate
     TYPE's functionality but make a new tab, LOVE, and bring the new changes
     there — if something goes wrong, we can roll back to TYPE"). TYPE's own
     words follow. Letters as bands, in three passes (Rembrandt.md §1;
     the owner, 2026-10-06; TYPE-Claude/TYPE.md, the prototype of Claude in
     chat): TRACE, the outlines in watercolour from the cup; MARKS, where
     each paint goes; DRAG, the dry brush through it. New Yuri's page: its
     board, the canvas from home, PROGRESS, TEST, INK; a cassette deck of
     keys for PLAY. -->
<header class="top">
  <div class="brand">
    <span class="logo">REMBRANDT</span>
    <span class="ver">v.1.0.1</span>
    <nav class="tabs" aria-label="Pages">
      <a href="index.html">TYPE</a>
      <a href="love.html" class="on">LOVE</a>
      <a href="nolan.html">NOLAN</a>
      <a href="test.html">Test</a>
      <a href="ink.html">Ink</a>
      <a href="calibration.html">Calibration</a>
      <a href="library.html">Library</a>
    </nav>
  </div>
  <div class="top-mid"></div>
</header>

<main>
  <nav class="tools" aria-label="Tools">
    <button class="tool on" data-tool="select" title="Select — drag the text to move it; the arrows move it a mm, with ⇧ ten (V)">
      <svg viewBox="0 0 24 24"><path d="M5 3l13 8-6 1.5L9 19z"/></svg>
      <span>V</span>
    </button>
    <div class="sep"></div>
    <button class="tool" id="btnUndo" title="Undo (⌘Z)"><svg viewBox="0 0 24 24"><path d="M9 7L4 12l5 5"/><path d="M4 12h10a6 6 0 0 1 0 12"/></svg></button>
    <button class="tool" id="btnRedo" title="Redo (⇧⌘Z)"><svg viewBox="0 0 24 24"><path d="M15 7l5 5-5 5"/><path d="M20 12H10a6 6 0 0 0 0 12"/></svg></button>
    <div class="sep"></div>
    <button class="tool" id="btnClear" title="Clear the canvas: no text (⌘Z brings it back)"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="1"/><path d="M8 8l8 8M16 8l-8 8"/></svg></button>
  </nav>

  <!-- the zoom, over the board (the owner, 2026-10-06, TYPE-Claude/Screenshot 2026-10-06 zoom.png) -->
  <div class="zoombar" id="zoombar">
    <button class="zk" id="zoomOut" title="Zoom out (⌘−)" aria-label="Zoom out"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
    <button class="zk pct" id="zoomFit" title="Back to 100 %: the whole table (⌘0)">100%</button>
    <button class="zk" id="zoomIn" title="Zoom in (⌘+). A pinch on the trackpad zooms where it is; two fingers move the board" aria-label="Zoom in"><svg viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></svg></button>
  </div>

  <section class="stage t-select" id="stage">
    <!-- the paints in stock by the Tools, colours with no names (the owner, 2026-10-06), as New Yuri's letters' strip -->
    <div class="paintstrip" id="paints" aria-label="Paints in stock"></div>
    <div class="board" id="board"><canvas id="cv"></canvas></div>
  </section>

  <aside class="panel">
    <section class="sec">
      <h3>Progress <span id="lamp"></span></h3>
      <div class="lcd" id="lcd" aria-live="polite"></div>
      <p class="runstate" id="runState"></p>
      <!-- a cassette deck (the owner, 2026-10-06): no PLAY, a key a pass, an icon on each as on a tape
           recorder and its name under it in the sliders' small letters; three rows — TEST and PAUSE, the
           passes in their order, the stops (the owner: "maybe three rows"). The one running stays down. -->
      <div class="runkeys deck">
        <button class="btn" id="btnTest" title="TEST, before the passes: one dip in the cup, a dot 20 mm in from each corner of the board — TL, TR, BR, BL — and home"><svg viewBox="0 0 24 24"><rect x="4.5" y="4.5" width="15" height="15" rx="1" class="thin"/><circle cx="8" cy="8" r="1.7" class="dot"/><circle cx="16" cy="8" r="1.7" class="dot"/><circle cx="16" cy="16" r="1.7" class="dot"/><circle cx="8" cy="16" r="1.7" class="dot"/></svg><span>Test</span></button>
        <button class="btn" id="btnPause" title="PAUSE the run; pressed, CONT. goes on"><svg viewBox="0 0 24 24" class="i-pause"><path d="M9 6v12M15 6v12" class="bold"/></svg><svg viewBox="0 0 24 24" class="i-cont"><path d="M8.5 6l10 6-10 6z" class="fill"/></svg><span>Pause</span></button>
      </div>
      <div class="runkeys deck passes">
        <button class="btn pass" id="btnTrace" data-pass="trace" title="TRACE, pass 1: the outline of every band in watercolour, from the cup"><svg viewBox="0 0 24 24"><rect x="2.5" y="7.5" width="19" height="9" rx="4.5"/></svg><span>Trace</span></button>
        <button class="btn pass" id="btnMarks" data-pass="marks" title="MARKS, pass 2: a mark across each band where its paint goes, its ticks the paint's number, from the same cup as TRACE"><svg viewBox="0 0 24 24"><path d="M3 12h18"/><path d="M13 8.5v7M16 8.5v7M19 8.5v7" class="thin"/></svg><span>Marks</span></button>
        <button class="btn pass" id="btnDrag" data-pass="drag" title="DRAG, pass 3: the dry brush through the paint, every lane non-stop, no dip"><svg viewBox="0 0 24 24"><path d="M3 7h13M3 12h16M3 17h13"/><path d="M16 9l3 3-3 3"/></svg><span>Drag</span></button>
      </div>
      <div class="stops">
        <button class="btn" id="btnStop" title="Stop the carriage and the arm, braking (Esc)">STOP</button>
        <button class="btn danger" id="btnKill" title="Stop the carriage at once and the arm where it is">HARD STOP</button>
      </div>
    </section>

    <div class="savebar">
      <button class="btn save" id="btnSave" title="Save the text in the Library, as a new save named by the date and time">💾 SAVE LOVE</button>
      <span class="save-state" id="saveState">to the Library</span>
    </div>
    <section class="sec">
      <h3>LOVE</h3>
      <h4 class="first">Overlaps</h4>
      <div class="toggles looks" id="overlaps">
        <button class="tog" data-overlap="wet" title="One session: every band marked and dragged wet on wet">Wet on wet</button>
        <button class="tog" data-overlap="letters" title="A band over another letter's waits for it to dry: a session later; a letter's own bands wet on wet">Dry between letters</button>
        <button class="tog" data-overlap="all" title="Every band over another waits for it to dry: a session later">Dry every overlap</button>
      </div>
      <!-- INK as on NOLAN: ON the brush dips in the cup of the Ink tab; OFF no dip, a run in the air or on what the brush holds -->
      <div class="inkrow" title="ON: the brush dips in the cup of the Ink tab, several outlines to a dip, as long as a dip carries (720 mm, est.), an outline never split; OFF: no dip">
        <span class="slh"><span>Ink</span></span>
        <div class="inline check ink"><span class="side" id="inkOff">Off</span><input id="ink" type="checkbox" aria-label="Ink"><span class="side" id="inkOn">On</span></div>
      </div>
      <!-- Pass through (the owner, 2026-10-06: "a switch as on NOLAN"; "(a)"): ON a letter's bands one DRAG path, the brush down through where they meet -->
      <div class="inkrow" title="ON: DRAG runs a letter's bands one after another with the brush down, on through where they meet; OFF: the brush lifts after every band">
        <span class="slh"><span>Pass through</span></span>
        <div class="inline check ink"><span class="side" id="throughOff">Off</span><input id="through" type="checkbox" aria-label="Pass through"><span class="side" id="throughOn">On</span></div>
      </div>
      <!-- the passes as they will look, before the machine runs them (the owner, 2026-10-06: "for the
           preliminary work I need to understand what the result will be — Result is needed"); a view only -->
      <div class="toggles looks" id="views">
        <button class="tog" data-view="trace" title="TRACE: the outlines in watercolour, as they lie on the paper">1 Trace</button>
        <button class="tog" data-view="marks" title="MARKS: a mark across a band where each paint goes, its ticks the paint's number, the colour the paint's; a click on a band steps its paint">2 Marks</button>
        <button class="tog" data-view="drag" title="DRAG: every lane of the dry brush, an orange dot where it lands">3 Drag</button>
        <button class="tog" data-view="result" title="The painting: the brush along DRAG's own path picks up the paint of every mark it crosses and carries it on — round into the next lane, with Pass through into the next band — until it runs out; the sessions dry and glaze over one another; a click on a band steps its paint">Result</button>
      </div>
      <!-- Play the run, from the LOVE prototype (the owner, 2026-10-07: "this preview shows how the paint will lie"): a view, not a key of the deck -->
      <div class="grid4 keys"><button class="btn" id="btnPlay" title="Result laid again in the order the brush goes, session after session, the whole run in 12 s; pressed again, it stops. A view: it moves nothing on the machine">▶ Play the run</button></div>
      <div class="toggles looks" id="sessions" hidden></div>
      <h4>Text</h4>
      <textarea id="text" rows="2" spellcheck="false" autocapitalize="characters" aria-label="Text"></textarea>
      <div class="sliders" id="slLetters"></div>
      <div class="grid4 keys"><button class="btn" id="btnFit" title="The tallest letters that fit inside the margin, the text in the middle of the canvas">Fit to canvas</button></div>
      <h4>Brush, pass 3</h4>
      <div class="sliders" id="slBrush"></div>
      <div class="toggles looks" id="orders">
        <button class="tog" data-order="out" title="Each band's outermost lane first, in to its centre">Outside first</button>
        <button class="tog" data-order="in" title="Each band's centre lane first, out to its edge">Inside first</button>
      </div>
      <h4>Paint layout, pass 2</h4>
      <div class="sliders" id="slPaint"></div>
      <h4>Simulation</h4>
      <div class="sliders" id="slSim"></div>
      <h4>Canvas <button class="info" id="planInfo" title="The plan: the bands, the trace, where the canvas lies from home">i</button></h4>
      <div class="grid4" id="fields"></div>
      <p class="read" id="planRead" hidden></p>
      <p class="read" id="planWarn" hidden></p>
    </section>

    <section class="sec">
      <h3>Reference <span class="hint">over the canvas, as tracing paper</span></h3>
      <div class="refrow">
        <div class="refthumb" id="refThumb"><span>no reference yet</span></div>
        <div class="refctl">
          <button class="btn" id="btnRef" title="An image over the canvas, to set the letters to: never painted as is">📎 Add new reference</button>
          <p class="read" id="refRead"></p>
          <input id="refOp" type="range" min="0" max="100" step="1" class="slider" aria-label="Opacity of the reference">
        </div>
      </div>
      <input type="file" id="refIn" accept="image/*" hidden>
    </section>
  </aside>
</main>

<footer class="status">
  <span id="hint"></span>
  <span id="stats"></span>
</footer>
<script type="module" src="src/love.js"></script>
</body>
</html>
